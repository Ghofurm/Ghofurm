<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Muchammad Abdul Ghofur — Backend, Flutter, dan IoT">
  <title>Muchammad Abdul Ghofur — Backend, Flutter, dan IoT</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="1110" cy="20" r="300" fill="url(#glow-cyan)"/>
  <circle cx="90" cy="310" r="280" fill="url(#glow-violet)"/>

  <rect x="60" y="30" width="1080" height="250" rx="20" fill="#0F172A" fill-opacity="0.78" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="60" y1="76" x2="1140" y2="76" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="90" cy="53" r="6" fill="#FF5F57"/>
  <circle cx="112" cy="53" r="6" fill="#FEBC2E"/>
  <circle cx="134" cy="53" r="6" fill="#28C840"/>
  <text x="1110" y="58" text-anchor="end" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="12" fill="#64748B">~/ghofurm</text>

  <rect x="98" y="104" width="3" height="146" rx="1.5" fill="url(#accent)"/>

  <text x="126" y="122" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="16" fill="#64748B">$ whoami</text>
  <text x="126" y="170" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="44" font-weight="700" fill="#F8FAFC">Muchammad Abdul Ghofur</text>

  <text x="126" y="208" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="19" font-weight="600">
    <tspan fill="#22D3EE">Backend Developer</tspan>
    <tspan fill="#64748B"> · </tspan>
    <tspan fill="#A78BFA">Flutter Developer</tspan>
    <tspan fill="#64748B"> · </tspan>
    <tspan fill="#34D399">IoT Enthusiast</tspan>
  </text>

  <text x="126" y="244" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#94A3B8">Membangun API yang rapi, aplikasi yang nyaman, dan alat IoT yang berguna.</text>

  <g transform="translate(950 120)">
    <rect width="130" height="110" rx="16" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5"/>
    <text x="28" y="70" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="36" font-weight="700" fill="#22D3EE" fill-opacity="0.75">&gt;_</text>
  </g>
</svg>
